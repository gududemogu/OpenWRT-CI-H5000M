name: Cache-Clean

on:
  # 仅手动触发，只删除WRT固件编译缓存
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # 删除cache必须要有 actions:write 权限

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Projects
        uses: actions/checkout@v5

      - name: Clean only WRT build cache (key prefix: MEDIATEK-WIFI-YES-)
        run: |
          set +e
          # 筛选出key以 MEDIATEK-WIFI-YES- 开头的缓存ID
          CACHE_IDS=$(gh cache list --json id --key "MEDIATEK-WIFI-YES-" --jq '.[].id')
          if [ -z "$CACHE_IDS" ]; then
            echo "未找到匹配的WRT编译缓存，无需清理"
            exit 0
          fi
          echo "$CACHE_IDS" | xargs -I {} gh cache delete {}
          echo "WRT固件编译缓存清理完成"
          exit 0

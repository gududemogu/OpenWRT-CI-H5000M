name: Auto-Clean

on:
  # 自动清理：每天 05:00 (CST) 在自动构建前执行，默认清理所有 Releases
  schedule:
    - cron: 0 21 * * *
  # 手动清理（默认同样清理所有 Releases）
  workflow_dispatch:

permissions: write-all

jobs:
  auto_clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old Releases and Workflows
        uses: ophub/delete-releases-workflows@main
        with:
          gh_token: ${{secrets.GITHUB_TOKEN}}
          delete_releases: true
          # 0 = 默认清理所有 Releases（不保留最新）
          releases_keep_latest: 0
          # 清理 Release 时一并删除关联 Tag，避免残留
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 30
